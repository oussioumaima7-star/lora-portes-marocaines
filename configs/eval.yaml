# Paramètres d'évaluation (communs à toutes les LoRA)
num_inference_steps: 30
guidance_scale: 7.5
images_per_prompt: 4
seeds: [0, 1, 2, 3]
lora_scales: [0.0, 0.5, 0.8, 1.0]     # 0.0 = modèle de base (référence)
negative_prompt: "blurry, low quality, watermark, text, deformed"

# Prompts "domaine" : doivent produire une porte marocaine
domain_prompts:
  - "a photo of a mrcdoor, traditional moroccan door"
  - "a mrcdoor with blue zellige tiles around it"
  - "a wooden mrcdoor in the medina of Fes, sunny day"
  - "a mrcdoor with a horseshoe arch and brass knocker"

# Prompts "généralisation" : combinent le concept avec des contextes absents des données
generalization_prompts:
  - "a mrcdoor in the snow"
  - "a mrcdoor on a modern glass building"
  - "a red mrcdoor at night, lit by a lantern"
  - "a watercolor painting of a mrcdoor"

# Prompts "fuite" : SANS le mot déclencheur -> l'image NE doit PAS changer de style
leakage_prompts:
  - "a photo of a cat on a sofa"
  - "a photo of a modern kitchen"
